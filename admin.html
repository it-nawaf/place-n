/* Layout: brand header → search strip → grid of arch-framed apartment cards; details open in a full sheet; owner editor is a side panel. */
:root{
  --bg:#F0EDE7; --surface:#E7E3DB; --line:#D7D2C7; --ink:#1C2025; --muted:#5C5F64;
  --gold:#B39B55; --gold-ink:#76632A; --gold-soft:#E6DDC4; --btn:#1C2025; --btn-ink:#E9DDB4;
  --booked:#DFDBD2; --booked-ink:#8E8B83; --pick:#1C2025; --pick-ink:#F3E7BF; --range:#E4DABF;
  --danger:#A3362B; --ok:#2F6B4F;
  --f-display:"Alexandria","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --shadow:0 18px 50px -26px rgba(60,50,30,.28);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#181C21; --surface:#20252C; --line:#2E343C; --ink:#EEEAE0; --muted:#A3A39E;
  --gold:#C7B072; --gold-ink:#D4BE80; --gold-soft:#2A2A22; --btn:#C7B072; --btn-ink:#181C21;
  --booked:#262B31; --booked-ink:#62656A; --pick:#C7B072; --pick-ink:#181C21; --range:#33312A;
  --danger:#E07B6F; --ok:#7CC3A0; --shadow:0 18px 50px -24px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#181C21; --surface:#20252C; --line:#2E343C; --ink:#EEEAE0; --muted:#A3A39E;
  --gold:#C7B072; --gold-ink:#D4BE80; --gold-soft:#2A2A22; --btn:#C7B072; --btn-ink:#181C21;
  --booked:#262B31; --booked-ink:#62656A; --pick:#C7B072; --pick-ink:#181C21; --range:#33312A;
  --danger:#E07B6F; --ok:#7CC3A0; --shadow:0 18px 50px -24px rgba(0,0,0,.7); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;direction:rtl}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1180px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);font-weight:300;text-wrap:balance;margin:0;letter-spacing:0}
.logo{color:var(--gold);display:block}

/* header */
.top{border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit}
.brand .logo{width:118px;height:34px}
.brand small{color:var(--muted);font-size:13px;border-inline-start:1px solid var(--line);padding-inline-start:14px}
.top nav{display:flex;gap:6px;align-items:center}
.link{background:none;border:0;color:var(--muted);padding:8px 10px;border-radius:8px;text-decoration:none;font-size:14px}
.link:hover{color:var(--ink);background:var(--surface)}
.theme-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px;border-radius:999px;font-size:13.5px}
.theme-btn:hover{border-color:var(--gold)}
.theme-btn svg{color:var(--gold)}
.owner-btn{border:1px solid var(--gold);color:var(--gold-ink);background:transparent;padding:7px 14px;border-radius:999px;font-size:14px}
.owner-btn:hover{background:var(--gold-soft)}

/* intro + search */
.intro{padding-block:44px 26px;display:grid;gap:26px}
.intro h1{font-size:clamp(28px,4.4vw,46px);line-height:1.3;max-width:18ch}
.intro h1 em{font-style:normal;color:var(--gold-ink)}
.intro p{margin:0;color:var(--muted);max-width:60ch}
.search{display:grid;grid-template-columns:repeat(2,minmax(0,1fr)) auto;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.search-wrap{position:relative}
.search label,.dbtn{background:var(--bg);display:grid;gap:2px;padding:12px 18px;min-width:0;text-align:start;border:0;align-content:start}
.dbtn b{font-weight:400;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dbtn b.ph-t{color:var(--muted)}
.dbtn span{font-size:12px;color:var(--muted)}
.dbtn.on{box-shadow:inset 0 -2px 0 var(--gold)}
.dpop{position:absolute;top:calc(100% + 10px);inset-inline-start:0;z-index:6;width:min(660px,100%);background:var(--bg);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px;display:grid;gap:14px}
.dp-hint{font-weight:500;font-size:15px}
.dp-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.search label span{font-size:12px;color:var(--muted);letter-spacing:.02em}
.search input,.search select{border:0;background:transparent;padding:0;font-size:15px;min-width:0;width:100%}
.search input:focus,.search select:focus{outline:none}
.search .go{background:var(--btn);color:var(--btn-ink);border:0;padding:0 26px;font-weight:500}
.filters-note{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;color:var(--muted);font-size:14px}
.chip-clear{background:var(--surface);border:1px solid var(--line);padding:4px 12px;border-radius:999px;font-size:13px}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:34px 26px;padding-block:8px 60px}
.card{display:grid;gap:12px;text-align:start;background:none;border:0;padding:0;color:inherit}
.arch{position:relative;aspect-ratio:1/1;max-width:100%;border-radius:18px;overflow:hidden;background:var(--surface)}
.arch img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s ease}
.card:hover .arch img{transform:scale(1.04)}
.arch .badge{position:absolute;bottom:12px;inset-inline-start:12px;background:rgba(24,28,33,.72);color:#F3E7BF;font-size:12px;padding:3px 10px;border-radius:999px;backdrop-filter:blur(4px)}
.arch .state{position:absolute;bottom:12px;inset-inline-end:12px;font-size:12px;padding:3px 10px;border-radius:999px;background:#F3E7BF;color:#181C21}
.arch .state.no{background:rgba(24,28,33,.82);color:#F0E9D8}
.card.is-booked .arch img,.card.is-booked .ph{filter:grayscale(.7);opacity:.6}
.card.is-booked .price b{color:var(--muted)}
.sample{display:inline-block;font-size:11px;color:var(--gold-ink);border:1px dashed var(--gold);border-radius:6px;padding:0 6px;margin-inline-start:6px;vertical-align:middle}
.ph{width:100%;height:100%;display:grid;place-items:center;color:var(--gold);background:
  radial-gradient(120% 70% at 50% 0%,var(--gold-soft),transparent 70%),var(--surface)}
.ph svg{width:38%;opacity:.55}
.card h3{font-size:19px;font-weight:400}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:13.5px}
.price{display:flex;align-items:baseline;gap:6px}
.price b{font-family:var(--f-display);font-weight:400;font-size:20px}
.price span{color:var(--muted);font-size:13px}
.empty{grid-column:1/-1;border:1px dashed var(--line);border-radius:18px;padding:40px 20px;text-align:center;color:var(--muted)}

/* footer */
footer{border-top:1px solid var(--line);background:var(--surface)}
footer .wrap{padding-block:34px;display:flex;flex-wrap:wrap;gap:28px;justify-content:space-between;align-items:flex-start}
footer .logo{width:96px;height:28px}
footer dl{margin:0;display:grid;grid-template-columns:auto auto;gap:4px 18px;font-size:14px}
footer dt{color:var(--muted)}
footer dd{margin:0}
footer a{color:var(--gold-ink)}
footer .phone{font-variant-numeric:tabular-nums;user-select:all}
footer .wrap{padding-bottom:96px}
.wa-float{position:fixed;z-index:25;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));display:inline-flex;align-items:center;gap:8px;background:#1F8F55;color:#fff;text-decoration:none;padding:11px 16px;border-radius:999px;font-size:14.5px;font-weight:500;box-shadow:0 10px 28px -10px rgba(0,0,0,.45)}
.wa-float:hover{filter:brightness(1.07)}
@media (max-width:860px){.sheet .detail{padding-bottom:100px}}

/* sheet */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-bar{position:sticky;top:0;z-index:2;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.sheet-bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.icon-btn{width:40px;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;font-size:20px;line-height:1}
.detail{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:40px;padding-block:24px 60px;align-items:start}
.gallery{display:grid;gap:10px}
.g-main{position:relative;aspect-ratio:3/2;max-width:100%;border-radius:18px;overflow:hidden;background:var(--surface)}
.g-main img{width:100%;height:100%;object-fit:cover;display:block}
.g-nav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:999px;border:0;background:rgba(255,255,255,.88);color:#181C21;font-size:22px;display:grid;place-items:center}
.g-nav.prev{inset-inline-start:12px}.g-nav.next{inset-inline-end:12px}
.g-count{position:absolute;bottom:12px;inset-inline-start:50%;transform:translateX(50%);background:rgba(24,28,33,.72);color:#F3E7BF;font-size:12px;padding:2px 10px;border-radius:999px}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.thumbs button{flex:0 0 76px;height:58px;border-radius:8px;overflow:hidden;border:2px solid transparent;padding:0;background:var(--surface)}
.thumbs button.on{border-color:var(--gold)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.d-head{display:grid;gap:6px;margin-top:22px}
.d-head h2{font-size:clamp(24px,3vw,34px)}
.d-head .where{color:var(--muted)}
.facts{display:flex;flex-wrap:wrap;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-block:22px}
.facts div{background:var(--bg);padding:12px 14px;display:grid;flex:1 1 104px}
.facts b{font-family:var(--f-display);font-weight:400;font-size:20px}
.facts span{font-size:12.5px;color:var(--muted)}
.sec{display:grid;gap:12px;padding-block:22px;border-top:1px solid var(--line)}
.sec h3{font-size:18px;font-weight:400}
.sec p{margin:0;max-width:65ch;white-space:pre-line}
.amen{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:0;list-style:none}
.amen li{border:1px solid var(--line);border-radius:999px;padding:4px 14px;font-size:14px}
.map-btn{justify-self:start;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px 16px;text-decoration:none;color:inherit;background:var(--surface)}
.map-btn:hover{border-color:var(--gold)}

/* booking box */
.book{position:sticky;top:76px;border:1px solid var(--line);border-radius:20px;padding:22px;display:grid;gap:16px;box-shadow:var(--shadow);background:var(--bg)}
.book .price b{font-size:28px}
.wk{font-size:13px;color:var(--muted)}
.dates{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.dates div{padding:8px 12px;display:grid}
.dates div+div{border-inline-start:1px solid var(--line)}
.dates span{font-size:11.5px;color:var(--muted)}
.sum{display:grid;gap:6px;font-size:14px}
.sum div{display:flex;justify-content:space-between;gap:10px}
.sum .total{border-top:1px solid var(--line);padding-top:8px;font-weight:600}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--gold);color:#181C21;border:0;border-radius:12px;padding:14px;font-weight:600;text-decoration:none;font-size:16px}
.cta:hover{filter:brightness(1.05)}
.cta[aria-disabled="true"]{opacity:.5;pointer-events:none}
.note{font-size:12.5px;color:var(--muted);margin:0}
.types{display:flex;flex-wrap:wrap;gap:8px}
.type-chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 16px;font-size:14px;color:var(--ink)}
.type-chip:hover{border-color:var(--gold)}
.type-chip.on{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.type-tag{font-size:12px;color:var(--gold-ink);letter-spacing:.02em;margin-bottom:2px}
.ls-note{font-size:13px;color:var(--ok);border:1px dashed var(--ok);border-radius:10px;padding:8px 12px;line-height:1.8}
.share-btn{justify-self:start;display:inline-flex;align-items:center;gap:8px;margin-top:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px}
.share-btn:hover{border-color:var(--gold)}
.share-btn svg{color:var(--gold)}
.share-box{display:grid;gap:10px;border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:6px;max-width:520px}
.share-acts{display:flex;flex-wrap:wrap;gap:8px}
.btn.wa-btn{text-decoration:none;color:#fff;background:#1F8F55;border-color:#1F8F55}
.day.deal{position:relative;color:var(--ok);font-weight:600}
.day.deal::after{content:"";position:absolute;bottom:3px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--ok)}
.day.ci.deal::after,.day.co.deal::after{background:var(--pick-ink)}
.legend .deal-dot{background:var(--ok);border-radius:50%}
.deal-b{position:absolute;top:12px;inset-inline-start:12px;background:#2F7A55;color:#fff;font-size:12px;padding:3px 10px;border-radius:999px}
.sum .save{color:var(--ok)}
.incl{font-size:12px;color:var(--muted);margin-top:-8px}
.book .incl{margin-top:2px}
.rate{display:inline-flex;align-items:baseline;gap:5px;font-size:13.5px;color:var(--muted);margin-top:2px}
.rate .star{color:var(--gold)}
.rate b{color:var(--ink);font-weight:600}
.rate.big{font-size:15px}
.rate-row{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline}
.rate-row a{font-size:13.5px;color:var(--gold-ink)}
.cancel-note{margin:0;font-size:13px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);color:var(--ink)}
.cancel-note.late{border-color:var(--danger);color:var(--danger)}
.msg{font-size:13px;padding:8px 12px;border-radius:10px;background:var(--gold-soft);color:var(--gold-ink)}

/* calendar */
.cal-head{display:flex;justify-content:space-between;align-items:center}
.cals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px}
.cal h4{margin:0 0 8px;font-family:var(--f-display);font-weight:400;font-size:15px;text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center}
.cal-grid .dn{font-size:11.5px;color:var(--muted);padding-bottom:4px}
.day{aspect-ratio:1;border:0;background:none;border-radius:10px;font-size:14px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.day:hover:not(:disabled){background:var(--surface)}
.day:disabled{cursor:default}
.day.past{color:var(--booked-ink);opacity:.5}
.day.booked{background:var(--booked);color:var(--booked-ink);text-decoration:line-through}
.day.synced{box-shadow:inset 0 0 0 1.5px var(--gold)}
.day.in{background:var(--range);border-radius:0}
.day.ci,.day.co{background:var(--pick);color:var(--pick-ink)}
.day.today{box-shadow:inset 0 0 0 1px var(--gold)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:middle;margin-inline-end:5px}

/* editor */
.panel{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;overscroll-behavior:contain}
.ed{display:grid;gap:22px;padding-block:22px 120px;max-width:900px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:10px 14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-color:var(--gold)}
.rows{display:grid;gap:10px}
.row{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px}
.row .th{width:64px;height:64px;border-radius:12px;overflow:hidden;background:var(--surface)}
.row .th img{width:100%;height:100%;object-fit:cover}
.row .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 14px;font-size:14px}
.btn:hover{border-color:var(--gold)}
.btn.pri{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.btn.warn{color:var(--danger)}
.btn.warn.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.form .full{grid-column:1/-1}
.fld{display:grid;gap:4px;min-width:0}
.fld>span{font-size:13px;color:var(--muted)}
.fld input,.fld textarea,.fld select{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--bg);width:100%;min-width:0}
.fld textarea{min-height:110px;resize:vertical}
.fld small{font-size:12px;color:var(--muted)}
.fset{border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:14px}
.fset>h3{font-size:16px;font-weight:400}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px;cursor:pointer}
.checks input{accent-color:var(--gold)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.ph-item{position:relative;aspect-ratio:1;max-width:100%;border-radius:12px;overflow:hidden;background:var(--surface)}
.ph-item img{width:100%;height:100%;object-fit:cover}

async function enhanceExisting(i){
  var a=draft.apts[S.edit],p=a.photos[i];if(!p||S.busy)return;
  setStatus("جاري تحسين الصورة ورفعها…","");
  try{var r=await compress(src(p),1600,.84,true);var np=await uploadPhoto(r.blob,r.canvas);np.e=1;a.photos[i]=np;
    S.dirty=true;renderAdmin();setStatus("حُسّنت الصورة. اضغط «حفظ ونشر» لتظهر للعملاء.","");
  }catch(e){setStatus(e&&e.code==="auth"?"انتهت صلاحية مفتاح GitHub. سجّل الخروج وأدخله من جديد.":"تعذّر تحسين هذه الصورة.","err")}
}
async function addPhotos(files){
  var a=draft.apts[S.edit],idx=S.edit,ok=0,fail=0;
  for(var i=0;i<files.length;i++){
    setStatus("جاري رفع الصورة "+(i+1)+" من "+files.length+"…","");
    try{var r=await compress(files[i],1600,.84,S.enh);var np=await uploadPhoto(r.blob,r.canvas);if(S.enh)np.e=1;a.photos.push(np);ok++}
    catch(e){fail++;if(e&&e.code==="auth"){setStatus("انتهت صلاحية مفتاح GitHub. سجّل الخروج وأدخله من جديد.","err");break}}
  }
  if(S.edit===idx){S.dirty=true;renderAdmin();setStatus(fail?("رُفعت "+ok+" صور، وتعذّر رفع "+fail+"."):("أُضيفت "+ok+" صور. اضغط «حفظ ونشر» لتظهر للعملاء."),fail?"err":"")}
}
async function save(){
  var bad=draft.apts.filter(function(a){return !a.gathern&&!a.name});
  if(bad.length){setStatus("كل شقة تحتاج رابط جاذر إن أو اسمًا.","err");return}
  S.busy=true;setStatus("جاري النشر…","");renderAdmin();
  var data=cleanDraft(draft);
  for(var attempt=0;attempt<3;attempt++){
    try{var latest=await ghGetData();var merged=merge3(GH.base,data,latest);
      await ghPut("data.json",b64utf8(JSON.stringify(merged,null,1)+"\n"),"تحديث الشقق من صفحة الإدارة",GH.sha);
      DATA=merged;GH.base=JSON.parse(JSON.stringify(merged));draft=JSON.parse(JSON.stringify(merged));S.dirty=false;S.busy=false;renderAdmin();
      setStatus("تم النشر. يظهر في الموقع خلال دقيقة أو دقيقتين.","ok");return}
    catch(e){if(e&&e.code==="conflict")continue;S.busy=false;renderAdmin();
      setStatus(e&&e.code==="auth"?"مفتاح GitHub غير صالح أو منتهي. سجّل الخروج وأدخله من جديد.":"تعذّر النشر. تأكد من الاتصال وحاول مرة أخرى.","err");return}
  }
  S.busy=false;renderAdmin();setStatus("تعذّر النشر بسبب تحديث متزامن. حاول مرة أخرى.","err");
}
async function ghRating(btn){
  btn.disabled=true;btn.textContent="جاري التشغيل…";
  try{var r=await fetch(ghUrl("/actions/workflows/rating.yml/dispatches"),{method:"POST",headers:ghHeaders(),body:JSON.stringify({ref:GH.BRANCH})});
    if(!r.ok)throw {status:r.status};
    btn.textContent="بدأ تحديث التقييم ✓";setStatus("بدأ تحديث التقييم. يستغرق دقيقتين تقريبًا، ثم يظهر في الموقع.","ok")}
  catch(e){btn.disabled=false;btn.textContent="★ تحديث التقييم";setStatus("تعذّر تشغيل تحديث التقييم.","err")}
}
async function ghCalInfo(){try{var r=await fetch(ghUrl("/actions/workflows/calendar.yml/runs?per_page=1"),{headers:ghHeaders()});if(!r.ok)return;
  var j=await r.json(),run=j.workflow_runs&&j.workflow_runs[0];if(!run)return;
  var dt=new Date(run.updated_at||run.created_at),ok=run.conclusion==="success";
  GH.calInfo="آخر فحص للتقويم: "+dt.toLocaleString("ar-SA-u-nu-latn",{timeZone:"Asia/Riyadh",day:"numeric",month:"long",hour:"numeric",minute:"2-digit"})+(run.status!=="completed"?" (جارٍ)":ok?" ✓":" (فشل)");
  if(draft&&S.edit===null)renderAdmin()}catch(e){}}
function loginHTML(msg){return '<div class="wrap" style="max-width:520px;padding-block:60px;display:grid;gap:16px">'+logo('style="width:120px;height:36px"')+'<h1 style="font-size:24px">إدارة place.n</h1><p class="note" style="font-size:14px">أدخل مفتاح GitHub الخاص بك مرة واحدة على هذا الجهاز. يُحفظ في هذا المتصفح فقط.</p><label class="fld"><span>مفتاح GitHub</span><input id="gh-token" type="password" dir="ltr" autocomplete="off" placeholder="github_pat_…"></label>'+(msg?'<p class="status err">'+esc(msg)+'</p>':'')+'<button class="btn pri" data-act="ghlogin" style="justify-self:start">دخول</button></div>'}
async function ghLogin(){var v=(document.getElementById("gh-token")||{}).value||"";v=v.trim();if(!v)return;GH.token=v;
  try{var d=await ghGetData();try{localStorage.setItem(GH.KEY,v)}catch(e){}start(d)}catch(e){GH.token=null;app.innerHTML=loginHTML(e&&e.code==="auth"?"المفتاح غير صحيح أو لا يملك صلاحية على المستودع.":"تعذّر الاتصال بـ GitHub. حاول مرة أخرى.")}}
function start(d){GH.base=JSON.parse(JSON.stringify(d));DATA=d;CAP.canEdit=true;CAP.artifact=true;render();openAdmin();ghCalInfo()}
/* ---------- events ---------- */
document.addEventListener("click",function(e){
  if(S.dp&&!e.target.closest(".dpop,.dbtn")&&!draft&&!S.open){S.dp=null;render()}
  var t=e.target.closest("[data-act],[data-open],[data-day],[data-sday],[data-gi],[data-tab],[data-ed],[data-del],[data-up],[data-pdel],[data-pfirst],[data-penh],[data-type],[data-dup],[data-qtype]");if(!t)return;
  var d=t.dataset;

  if(d.dup!==undefined){var src0=draft.apts[+d.dup],c=JSON.parse(JSON.stringify(src0));c.id=uid();c.name="";c.gathern="";c.ical="";c.ical2="";c.photos=[];c.booked=[];c.sync=[];["nightly","pre","rating","reviews","priceAt","checkAt","syncAt","sample"].forEach(function(k){delete c[k]});draft.apts.splice(+d.dup+1,0,c);S.edit=+d.dup+1;S.calBase=null;mark();renderAdmin();layer.querySelector(".panel").scrollTop=0;setStatus("نُسخت المواصفات. الصق رابطي جاذر إن وأضف الصور، ثم «حفظ ونشر».","");return}
  if(d.qtype!==undefined){var qa=draft.apts[S.edit],n=+d.qtype;qa.rooms=n;qa.halls=1;qa.beds=n;qa.baths=n;qa.guests={1:4,2:6,3:8}[n];mark();renderAdmin();return}
  if(d.open){openApt(d.open);return}
  if(d.gi){S.gi=+d.gi;renderDetail();return}
  if(d.tab){S.tab=d.tab;renderAdmin();return}
  if(d.ed!==undefined){S.edit=+d.ed;S.calBase=null;renderAdmin();layer.querySelector(".panel").scrollTop=0;return}
  if(d.up!==undefined){var i=+d.up;if(i>0){var x=draft.apts.splice(i,1)[0];draft.apts.splice(i-1,0,x);mark();renderAdmin()}return}
  if(d.del!==undefined){if(!t.classList.contains("armed")){layer.querySelectorAll(".armed").forEach(function(b){b.classList.remove("armed");b.textContent="حذف"});t.classList.add("armed");t.textContent="تأكيد الحذف";return}draft.apts.splice(+d.del,1);mark();renderAdmin();return}
  if(d.pdel!==undefined){draft.apts[S.edit].photos.splice(+d.pdel,1);mark();renderAdmin();return}
  if(d.penh!==undefined){enhanceExisting(+d.penh);return}
  if(d.pfirst!==undefined){var ps=draft.apts[S.edit].photos,q=ps.splice(+d.pfirst,1)[0];ps.unshift(q);mark();renderAdmin();return}
  if(d.sday){var ds=d.sday;if(S.dp==="ci"||!S.ci||ds<=S.ci||(S.ci&&S.co&&S.dp!=="co")){S.ci=ds;if(S.co&&S.co<=ds)S.co=null;S.dp="co"}else{S.co=ds;S.dp=null}render();return}
  if(d.day){if(S.edit!==null&&draft){var a=draft.apts[S.edit];a.booked=a.booked||[];var k=a.booked.indexOf(d.day);if(k>=0)a.booked.splice(k,1);else a.booked.push(d.day);a.booked.sort();mark();document.getElementById("ed-cal").innerHTML=calHTML(a,S.calBase,"toggle")}else pickDay(d.day);return}
  switch(d.act){
    case "home":e.preventDefault();try{history.scrollRestoration="manual"}catch(x){}if(S.open){closeApt();setTimeout(function(){window.scrollTo({top:0,behavior:"smooth"})},80)}else window.scrollTo({top:0,behavior:"smooth"});break;
    case "contact":break;
    case "clear":S.ci=S.co=null;S.dp=null;S.guests=0;S.type=0;render();break;
    case "close":closeApt();break;
    case "tocal":(function(){var c=layer.querySelector(".detail .cals");if(c)c.scrollIntoView({behavior:"smooth",block:"center"})})();break;
    case "gprev":S.gi=(S.gi-1+apts().find(function(x){return x.id===S.open}).photos.length)%apts().find(function(x){return x.id===S.open}).photos.length;renderDetail();break;
    case "gnext":S.gi=(S.gi+1)%apts().find(function(x){return x.id===S.open}).photos.length;renderDetail();break;
    case "calprev":S.calBase=new Date(S.calBase.getFullYear(),S.calBase.getMonth()-1,1);draft&&S.edit!==null?renderAdmin():renderDetail();break;
    case "calnext":S.calBase=new Date(S.calBase.getFullYear(),S.calBase.getMonth()+1,1);draft&&S.edit!==null?renderAdmin():renderDetail();break;
    case "dpick":S.dp=S.dp===d.which?null:d.which;if(S.dp==="co"&&!S.ci)S.dp="ci";S.dpBase=null;render();break;
    case "dprev":S.dpBase=new Date(S.dpBase.getFullYear(),S.dpBase.getMonth()-1,1);render();break;
    case "dnext":S.dpBase=new Date(S.dpBase.getFullYear(),S.dpBase.getMonth()+1,1);render();break;
    case "dreset":S.ci=S.co=null;S.dp="ci";render();break;
    case "dclose":S.dp=null;render();break;
    case "theme":THEME=THEME==="dark"?"light":"dark";try{localStorage.setItem("placen-theme",THEME)}catch(err){}applyTheme();render();break;
    case "share":S.share=!S.share;renderDetail();if(S.share){var inp=document.getElementById("share-url");if(inp)inp.focus()}break;
    case "copylink":(function(){var inp=document.getElementById("share-url");var done=function(){t.textContent="تم نسخ الرابط ✓"};try{navigator.clipboard.writeText(inp.value).then(done,function(){inp.select()})}catch(err){inp.select()}})();break;
    case "admin":openAdmin();break;
    case "adclose":closeAdmin();break;
    case "discard":S.dirty=false;closeAdmin(true);break;
    case "back":S.edit=null;S.calBase=null;renderAdmin();break;
    case "new":draft.apts.unshift({id:uid(),name:"",district:"",city:"",price:"",wkPrice:"",guests:4,rooms:1,halls:1,beds:1,baths:1,desc:"",amen:[],photos:[],map:"",gathern:"",ical:"",booked:[]});S.edit=0;S.calBase=null;mark();renderAdmin();layer.querySelector(".panel").scrollTop=0;break;
    case "amenadd":var inp=document.getElementById("amen-new"),v=inp.value.trim();if(v){var am=draft.apts[S.edit].amen;if(am.indexOf(v)<0)am.push(v);mark();renderAdmin()}break;
    case "save":save();break;
    case "rating":ghRating(t);break;
    case "logout":try{localStorage.removeItem(GH.KEY)}catch(e){}location.reload();break;

  }
});
