name: apartment-pages
on:
  push:
    branches: [main]
    paths: ["data.json", "index.html", "img/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-json
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pillow
      - name: Build and publish (retries if other uploads land meanwhile)
        run: |
          git config user.name "place-n bot"
          git config user.email "bot@users.noreply.github.com"
          for i in 1 2 3 4 5 6; do
            python3 scripts/optimize_img.py
            python3 scripts/gen_pages.py
            rm -rf scripts/__pycache__
            git add -A
            if git diff --cached --quiet; then echo "no changes"; exit 0; fi
            git commit -q -m "صفحات مشاركة الشقق"
            if git push -q; then exit 0; fi
            echo "push rejected, rebuilding on the latest version ($i)"
            sleep $((i*4))
            git fetch -q origin main && git reset -q --hard origin/main
          done
          echo "gave up for now; the next upload will rebuild"; exit 0
