name: apartment-pages
on:
  push:
    branches: [main]
    paths: ["data.json", "index.html", "img/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-json
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pillow
      - name: Shrink new photos
        run: python3 scripts/optimize_img.py
      - name: Make apartment pages
        run: python3 scripts/gen_pages.py
      - name: Commit changes
        run: |
          git config user.name "place-n bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "صفحات مشاركة الشقق"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
