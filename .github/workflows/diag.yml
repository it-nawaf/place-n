name: diag
on: [push]
permissions:
  contents: write
jobs:
  d:
    if: contains(github.event.head_commit.message, '[diag]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'P' > diag.txt
          import json,re,urllib.request
          d=json.load(open('data.json'))
          for a in d['apts']:
              if a['name'] not in ('شقة 211','شقة 106','شقة 210'): continue
              for k in ('ical','ical2'):
                  u=a.get(k)
                  if not u: continue
                  try:
                      t=urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=30).read().decode('utf8','replace')
                  except Exception as e:
                      print(a['name'],k,'ERR',e);continue
                  evs=t.split('BEGIN:VEVENT')[1:]
                  print(a['name'],k,u.split('/')[2],len(evs),'events')
                  for ev in evs:
                      s=re.search(r'DTSTART[^:]*:(\d{8})',ev);e=re.search(r'DTEND[^:]*:(\d{8})',ev);sm=re.search(r'SUMMARY:(.*)',ev)
                      print('   ',s and s.group(1),e and e.group(1),(sm.group(1).strip() if sm else '')[:50])
          P
          git config user.name "place-n bot"; git config user.email "bot@users.noreply.github.com"
          git add diag.txt; git commit -m "diag output"; git pull --rebase; git push
