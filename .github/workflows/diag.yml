name: diag
on: [push]
permissions:
  contents: write
jobs:
  d:
    if: contains(github.event.head_commit.message, '[diag]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'P' > diag/js.txt
          import re,urllib.request
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'
          s=open('diag/view.html',encoding='utf8').read()
          urls=sorted(set(re.findall(r'/_next/static/[^"\']+\.js',s)))
          seen=set()
          for u in urls:
              try: t=urllib.request.urlopen(urllib.request.Request('https://gathern.co'+u,headers={'User-Agent':UA}),timeout=30).read().decode('utf8','replace')
              except Exception as e: print('ERR',u,e);continue
              for m in re.finditer(r'review',t,re.I):
                  sn=t[max(0,m.start()-160):m.start()+160].replace('\n',' ')
                  k=sn[100:220]
                  if k in seen: continue
                  seen.add(k)
                  if re.search(r'/|api|url|get|fetch',sn): print(u.split('/')[-1],'::',sn);print('----')
          for m in set(re.findall(r'https://[a-z0-9.-]+gathern[a-z0-9.-]*',open('diag/view.html',encoding='utf8').read())): print('HOST',m)
          P
          git config user.name "place-n bot"; git config user.email "bot@users.noreply.github.com"
          git add diag; git commit -m "diag output"; git pull --rebase; git push
