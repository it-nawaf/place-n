name: diag
on: [push]
permissions:
  contents: write
jobs:
  d:
    if: contains(github.event.head_commit.message, '[diag]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'P' > diag.txt
          import json,re,urllib.request,urllib.parse,time
          d=json.load(open('data.json'))
          a=[x for x in d['apts'] if x['name'].endswith('004')][0]
          def get(u): return urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'}),timeout=30).read().decode('utf8','replace')
          u=a['ical']; p=urllib.parse.urlsplit(u); m=re.match(r'^(.*/)([^/]+)(\.ics)$',p.path); b=int(time.time())
          sp=''.join('%%%02X'%ord(c) if k==b%len(m.group(2)) else c for k,c in enumerate(m.group(2)))
          fresh=urllib.parse.urlunsplit((p.scheme,p.netloc,m.group(1)+sp+m.group(3),'_=%d'%b,''))
          for tag,url in (('plain',u),('fresh',fresh)):
              t=get(url); evs=t.split('BEGIN:VEVENT')[1:]
              print(tag,len(evs),'events')
              for ev in evs:
                  f=lambda r:(re.search(r,ev) or [None,''])[1]
                  print('  ',f(r'DTSTART[^:]*:(\d{8})'),'->',f(r'DTEND[^:]*:(\d{8})'),'|',f(r'SUMMARY:(.*)').strip()[:40],'| stamp',f(r'DTSTAMP:(\S+)'))
          P
          git config user.name "place-n bot"; git config user.email "bot@users.noreply.github.com"
          git add diag.txt; git commit -m "diag output"; git pull --rebase; git push
