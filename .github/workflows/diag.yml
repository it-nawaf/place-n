name: diag
on: [push]
permissions:
  contents: write
jobs:
  d:
    if: contains(github.event.head_commit.message, '[diag]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'P' > diag.txt
          import json,re,urllib.request,time,urllib.parse
          d=json.load(open('data.json'))
          def get(u):
              return urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'}),timeout=30).read().decode('utf8','replace')
          def fresh(u,b):
              p=urllib.parse.urlsplit(u);m=re.match(r'^(.*/)([^/]+)(\.ics)$',p.path)
              if not m: return u+('&' if '?' in u else '?')+'_='+str(b)
              name=urllib.parse.unquote(m.group(2));i=b%len(name)
              sp=''.join('%%%02X'%ord(c) if k==i else c for k,c in enumerate(name))
              return urllib.parse.urlunsplit((p.scheme,p.netloc,m.group(1)+sp+m.group(3),'_=%d'%b,''))
          for a in d['apts']:
              if a['name'] not in ('شقة 107','شقة 306'): continue
              for k in ('ical','ical2'):
                  u=a.get(k)
                  if not u: continue
                  for tag,url in (('plain',u),('fresh',fresh(u,int(time.time())))):
                      try: t=get(url)
                      except Exception as e: print(a['name'],k,tag,'ERR',e);continue
                      evs=t.split('BEGIN:VEVENT')[1:]
                      print(a['name'],k,tag,len(evs),'events')
                      for ev in evs:
                          f=lambda r:(re.search(r,ev) or [None,''])[1]
                          print('   ',f(r'DTSTART[^:]*:(\d{8})'),f(r'DTEND[^:]*:(\d{8})'),f(r'SUMMARY:(.*)').strip()[:40],'| stamp',f(r'DTSTAMP:(\S+)'),'| uid',f(r'UID:(\S+)')[:30])
          P
          git config user.name "place-n bot"; git config user.email "bot@users.noreply.github.com"
          git add diag.txt; git commit -m "diag output"; git pull --rebase; git push
