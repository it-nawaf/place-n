name: calendar
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-json
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Sync booked nights
        run: python3 scripts/sync_calendar.py
      - name: Commit changes
        run: |
          git config user.name "place-n bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "مزامنة التقويم"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
