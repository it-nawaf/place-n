name: debug-desc
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-json
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fill descriptions
        run: python3 scripts/debug_desc.py
      - name: Commit changes
        run: |
          git config user.name "place-n bot"
          git config user.email "bot@users.noreply.github.com"
          git add debug
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "تشخيص مؤقت"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
